[project]
name = "swe-qwen"
version = "0.1.0"
description = "Production-grade LLMOps platform for fine-tuning open-weight LLMs for automated software issue resolution"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "SWE-Qwen Team", email = "team@swe-qwen.dev"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Core ML/AI
    "torch==2.13.0",
    "transformers>=5.5.0,<5.6.0",
    "peft>=0.19.0",
    "bitsandbytes>=0.49.0",
    "accelerate>=1.14.0",
    "trl>=1.9.0",
    # Data processing
    "datasets>=5.0.0",
    "pandas>=2.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # Cloud/Infrastructure
    "google-cloud-storage>=2.19.0",
    "google-cloud-bigquery>=3.25.0",
    "google-auth>=2.29.0",
    "modal>=1.5.0",
    # Experiment tracking
    "wandb>=0.28.0",
    # Langfuse for LLM observability
    "langfuse>=2.60.0",
    # Inference serving
    "vllm>=0.26.0; sys_platform == 'linux'",
    "openai>=1.70.0",
    # Utilities
    "jinja2>=3.1.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.1",
    "unidiff>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.6.0",
    "pytest-timeout>=2.3.1",
    "pytest-json-report>=1.5.0",
    "hypothesis>=6.100.0",
    "ruff==0.16.2",
    "mypy>=1.14.0",
    "pre-commit>=4.2.0",
    "types-requests>=2.32.0",
    "types-pyyaml>=6.0.12",
]
training = [
    "deepspeed>=0.16.0",
]
eval = [
    "docker>=7.1.0",
]
inference = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "sse-starlette>=2.2.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.6.0",
    "mkdocstrings[python]>=0.28.0",
]
dashboards = [
    # Dashboards-as-code (Public Preview), decision 5 — requires `wandb login`
    "wandb-workspaces>=0.4.4",
]

[project.scripts]
data-pipeline = "data_engineering.run_pipeline:app"
train = "training.qlora_train:app"
eval = "evaluation.cli:app"
serve = "inference.serve:app"

[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["data_engineering*", "training*", "evaluation*", "inference*", "scripts*", "observability*", "promotion*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    ".mypy_cache",
    ".ruff_cache",
    "dist",
    "build",
    "*.egg-info",
    "models/checkpoints",
    "wandb",
    ".modal",
    "htmlcov",
    ".coverage",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL",  # pylint
    "TRY", # tryceratops
]
ignore = [
    "S101",  # assert used (allowed in tests)
    "TRY003", # avoid specifying long messages outside the exception class
    "ARG001", # unused function argument (common in callbacks)
    "ARG002", # unused method argument (common in callbacks)
    "PLC0415", # import at top-level — lazy imports in Modal functions are intentional
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG001", "ARG002", "ARG004", "ARG005", "PLR2004", "B018", "F841", "E741", "SIM117", "PLR0913", "PLR0917", "E402"]
"*.py" = ["T201"]
"data_engineering/cli.py" = ["B008", "PLR0913", "PLR0917", "W292"]
"evaluation/cli.py" = ["B008", "PLR0913", "PLR0917"]
"data_engineering/card.py" = ["E501"]
"data_engineering/split.py" = ["E402", "F401"]
"data_engineering/run_pipeline.py" = ["SIM103", "PLW2901", "TRY401", "PLR0912", "PLR0915", "TRY003", "F841", "SIM105"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint.isort]
known-third-party = ["modal", "wandb"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
files = [
    "data_engineering",
    "training",
    "scripts",
    "evaluation",
    "inference",
    "observability",
    "promotion",
]
exclude = [
    "models/checkpoints",
    "wandb",
    ".modal",
    "tests/fixtures",
]
[[tool.mypy.overrides]]
module = ["pydantic.*", "google.*", "wandb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config -p no:warnings --durations=10"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests (>10s)",
    "requires_modal: Tests requiring Modal credentials",
    "requires_gcp: Tests requiring GCP credentials",
    "requires_wandb: Tests requiring W&B credentials",
    "requires_credentials: Tests requiring any external credentials (GCP/W&B/env)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["training", "data_engineering", "scripts", "inference", "evaluation", "observability", "promotion"]
omit = ["tests/*", "*/__pycache__/*", "*/conftest.py"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 2

[tool.pre-commit-hooks]
# Pre-commit hook configurations are in .pre-commit-config.yaml
