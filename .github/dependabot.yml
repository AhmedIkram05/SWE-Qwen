# Dependabot: PR-based dependency updates (no auto-merge — every bump is
# reviewed and passes CI + the eval gate before landing).
# Unified Monday-morning schedule: weekly, Monday 09:00 Europe/London.
version: 2
updates:
  # Python deps (pyproject.toml). Uses the `pip` ecosystem rather than `uv`:
  # this project supports a wide Python/platform matrix that uv's resolver
  # cannot satisfy inside Dependabot (it errors across the marker splits).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    target-branch: "main"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
    ignore:
      # torch is hard-pinned ==2.13.0: every vllm since 0.26 pins torch (2.11.0
      # / 2.13.0), so a torch bump makes `uv sync` unsatisfiable until a vllm
      # release tracks it. Remove this once vllm accepts torch 2.14+.
      - dependency-name: "torch"
        versions: [">=2.14, <3"]
      # transformers 5.15.0 removed TrainingArguments.warmup_ratio (verified:
      # present in 5.14.0, gone in 5.15.0). This repo uses it in
      # training/callbacks.py, splats it from config/qlora_variants.yaml into
      # SFTConfig, and relies on it in test fixtures. Migrate warmup_ratio ->
      # warmup_steps (float ratio) first; then remove this entry.
      - dependency-name: "transformers"
        versions: [">=5.15.0, <5.20.0"]
    # Collapse minor/patch bumps into one PR per run so the GPU eval gate
    # fires once, not once per package. Major versions stay individual PRs.
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions (workflow versions).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    target-branch: "main"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
