name: "CI: Lint, Type-Check & Test"

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  PYTHON_VERSION: "3.11"
  HF_XET_DISABLE: "1"  # avoids hf_xet Rust panic on global trace subscriber conflict

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-

      - name: Cache mypy
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ hashFiles('pyproject.toml') }}-${{ hashFiles('data_engineering/**', 'training/**', 'evaluation/**', 'inference/**') }}

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run Ruff (lint)
        run: uv run ruff check data_engineering/ training/ tests/ evaluation/ inference/

      - name: Run Ruff (format check)
        run: uv run ruff format --check data_engineering/ training/ tests/ evaluation/ inference/

      - name: Run MyPy
        run: uv run mypy data_engineering/ training/ evaluation/ inference/

      - name: Run pytest (all tests — coverage gate)
        run: |
          # Two invocations: the "slow"-marked tests (e.g. trainer smoke) install
          # a global tracing dispatcher and panic when sharing a worker with
          # other tests, so they must run in isolation. Both always run; any
          # failure fails the step. --cov-fail-under: measured total coverage
          # 2026-08-07 was 54.08% — threshold 50 leaves regression headroom.
          set +e
          uv run pytest tests/ -q --tb=short -n auto \
            -m "not requires_credentials and not slow" \
            --cov --cov-append || fast_rc=$?
          uv run pytest tests/ -q --tb=short -n auto \
            -m "slow and not requires_credentials" \
            --cov --cov-append --cov-report=xml --cov-fail-under=90 || slow_rc=$?
          set -e
          if [ "${fast_rc:-0}" -ne 0 ] || [ "${slow_rc:-0}" -ne 0 ]; then
            echo "::error::pytest failed (fast=${fast_rc:-0}, slow=${slow_rc:-0})"
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: ./coverage.xml
          flags: unittests
          name: swe-qwen-codecov
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: infra/terraform/.terraform
          key: terraform-${{ hashFiles('infra/terraform/**/*.tf', 'infra/terraform/**/*.tfvars') }}

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
