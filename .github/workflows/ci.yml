name: "CI: Lint, Type-Check & Test"

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  PYTHON_VERSION: "3.11"
  HF_XET_DISABLE: "1"  # avoids hf_xet Rust panic on global trace subscriber conflict

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Ruff (lint)
        run: uv run ruff check data_engineering/ training/ tests/ evaluation/ inference/

      - name: Run Ruff (format check)
        run: uv run ruff format --check data_engineering/ training/ tests/ evaluation/ inference/

      - name: Run MyPy
        run: uv run mypy data_engineering/ training/ evaluation/ inference/

      - name: Run pytest (all tests — coverage gate)
        run: |
          # One run for the whole suite (fast + slow); --cov-fail-under enforces
          # the 7.3 coverage gate. Threshold calibrated on first CI run; adjust
          # here if the repo's true coverage differs.
          uv run pytest tests/ -q --tb=short -n auto \
            -m "not requires_credentials" \
            --cov --cov-report=xml --cov-fail-under=75

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: ./coverage.xml
          flags: unittests
          name: swe-qwen-codecov
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: infra/terraform/.terraform
          key: terraform-${{ hashFiles('infra/terraform/**/*.tf', 'infra/terraform/**/*.tfvars') }}

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

  # terraform-plan lives in cd.yml (plan on PR, apply gated by the
  # `production` environment) — kept out of CI to match repo conventions.

  notify:
    name: Notify on Failure
    needs: [lint-and-test, terraform-validate]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send notification
        if: failure()
        run: |
          echo "Workflow failed. Check GitHub Actions for details."
          # Add Slack/Discord/Email notification here
