name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff (lint)
        run: ruff check .

      - name: Run Ruff (format check)
        run: ruff format --check .

      - name: Run MyPy
        run: mypy src/

      - name: Run pytest with coverage
        run: pytest tests/ -v --tb=short -x --cov=src --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: ./coverage.xml
          flags: unittests
          name: swe-qwen-codecov
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── Structural check (lightweight) ──────────────────────────
  verify-repos:
    name: Verify Repos
    runs-on: ubuntu-latest
    outputs:
      repo_matrix: ${{ steps.set-matrix.outputs.repo_matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install SWE-Qwen
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Generate candidates.json from manifest
        run: |
          python3 -c "
          import json
          m = json.load(open('repos/manifest.json'))
          candidates = []
          for r in m['repositories']:
              candidates.append({
                  'url': r['url'],
                  'owner': r['owner'],
                  'name': r['name'],
                  'domain': r.get('domain_category', ''),
              })
          with open('candidates.json', 'w') as f:
              json.dump(candidates, f, indent=2)
          with open('repo-list.json', 'w') as f:
              json.dump([f\"{r['owner']}/{r['name']}\" for r in m['repositories']], f)
          print(f'Wrote {len(candidates)} candidates')
          "
      - name: Structural check (pytest config, pip install, import)
        run: python scripts/verify_repos.py --workers 14
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate matrix from manifest
        id: set-matrix
        run: |
          echo "repo_matrix=$(cat repo-list.json | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            verified.json
            repo-list.json

  # ── Full test verification (matrix, per-repo) ───────────────
  verify-repos-tests:
    name: Test ${{ matrix.repo }}
    needs: verify-repos
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.verify-repos.outputs.repo_matrix) }}
    steps:
      - name: Clone ${{ matrix.repo }}
        run: |
          git clone --depth=1 https://github.com/${{ matrix.repo }}.git /tmp/repo
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install repo with test deps
        run: |
          python -m pip install --upgrade pip
          for spec in ".[dev,test,testing,tests]" ".[testing]" ".[tests]" "."; do
            if pip install -e "$spec"; then break; fi
          done
        working-directory: /tmp/repo
      - name: Run pytest
        run: |
          python -m pytest -x -m "not slow and not requires_modal and not requires_gcp" \
            --tb=short -q 2>&1 | tail -20
        working-directory: /tmp/repo
        timeout-minutes: 15
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.repo }}
          path: /tmp/repo/.pytest_cache
          if-no-files-found: ignore

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: infra/terraform/.terraform
          key: terraform-${{ hashFiles('infra/terraform/**/*.tf', 'infra/terraform/**/*.tfvars') }}

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

  terraform-plan:
    name: Terraform Plan
    needs: terraform-validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: infra/terraform
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: infra/terraform/.terraform
          key: terraform-${{ hashFiles('infra/terraform/**/*.tf', 'infra/terraform/**/*.tfvars') }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -lock=false -no-color \
            -var="gcp_project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="gcp_region=${{ secrets.GCP_REGION }}" \
            -var="environment=dev" \
            -var="repository_name=${{ github.repository }}" \
            -var="repository_owner=${{ github.repository_owner }}" \
            2>&1 | tee plan.txt

      - name: Publish Plan to CI Summary
        if: always()
        run: |
          echo '## Terraform Plan' >> $GITHUB_STEP_SUMMARY
          echo '```terraform' >> $GITHUB_STEP_SUMMARY
          cat plan.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  modal-deploy:
    name: Modal Deploy
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Modal
        run: pip install modal

      - name: Deploy Modal App
        run: modal deploy src/swe_qwen/modal_app.py
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

  docker-build:
    name: Docker Build
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/swe-qwen/swe-qwen:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify:
    name: Notify
    needs: [lint-and-test, terraform-validate, modal-deploy, docker-build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send notification
        if: failure()
        run: |
          echo "Workflow failed. Check GitHub Actions for details."
          # Add Slack/Discord/Email notification here
