# ── QLoRA Variant Configs ─────────────────────────────────────────────────────
# Three mandatory comparison configs for Phase 4.12.
# Variants inherit unspecified values from the `baseline` template.
# Used by training/qlora_config.py to produce (LoraConfig, TrainingArguments).

variants:
  baseline:
    lora:
      r: 16
      lora_alpha: 32
      lora_dropout: 0.05
      target_modules: null          # resolved from model config at runtime
      bias: "none"
      task_type: "CAUSAL_LM"
    training:
      learning_rate: 2.0e-5
      num_train_epochs: 3
      per_device_train_batch_size: 1
      gradient_accumulation_steps: 16
      warmup_ratio: 0.03
      lr_scheduler_type: "cosine"
      weight_decay: 0.01
      max_grad_norm: 1.0
      fp16: false
      bf16: true
      optim: "paged_adamw_8bit"
      logging_steps: 10
      save_strategy: "steps"
      save_steps: 500
      eval_strategy: "steps"
      eval_steps: 500
      save_total_limit: 3
      load_best_model_at_end: true
      metric_for_best_model: "eval_loss"
      greater_is_better: false
      report_to: "wandb"
      ddp_find_unused_parameters: false
      gradient_checkpointing: true
      dataloader_num_workers: 2
      remove_unused_columns: false
      packing: true
      max_seq_length: 32768

  higher_rank:
    lora:
      r: 32
      lora_alpha: 64
      lora_dropout: 0.05
      # target_modules, bias, task_type inherit from baseline
    training:
      learning_rate: 2.0e-5
      # all other training args inherit from baseline

  higher_lr:
    lora:
      r: 16
      lora_alpha: 32
      lora_dropout: 0.05
      # target_modules, bias, task_type inherit from baseline
    training:
      learning_rate: 5.0e-5
      # all other training args inherit from baseline
